name: Manual Rebuild Database | Sitemap
# 稿件数据已拆分至 OpenST-mc/archive，本工作流仅作手动全量重建入口；
# 日常更新由 sync-archive.yml 接收稿件库 dispatch 自动完成
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Build Script
        run: |
          node data/build.js
          node data/sitemap.js

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 手动重建数据库及站点地图 [skip ci]"
          file_pattern: 'archive/data/database.json sitemap.xml robots.txt'
