<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0"/>
    <meta name="referrer" content="no-referrer">
    <title>OpenST | Litematic Viewer</title>
    <link rel="icon" href="/images/favicon.png" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-2.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-2.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-2.png">
    <link rel="icon" type="image/png" sizes="128x128" href="/images/favicon-2.png">
    <link rel="icon" type="image/png" sizes="196x196" href="/images/favicon-2.png">
    <link rel="apple-touch-icon" href="/images/favicon.png" sizes="any">

    <script src="/vendor/deepslate.umd.js"></script>
    <script src="/vendor/gl-matrix-min.js"></script>
    <script src="/Extra-Function/litematic-preview/resource/assets.js"></script>
    <script src="/Extra-Function/litematic-preview/resource/opaque.js"></script>

    <link rel="stylesheet" href="../../css/ArchiveOutput.css">
    <link rel="stylesheet" href="/vendor/material-icons.css">
    <link rel="stylesheet" href="/vendor/font-awesome.css">
    <script src="/vendor/insights.bundle.js" defer></script>

    <style>
        :root {
            --primary: #40B5AD;
            --bg-dark: #0c0c0c;
            --panel-bg: rgba(20, 20, 20, 0.85);
        }

        *, *::before, *::after {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #e0e0e0;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            margin: 0;
        }

        /* 3D 背景层 */
        #viewer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        /* 玻璃拟态面板 */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.5s ease;
        }

        #drop-zone {
            display: block;
            border: 2px dashed rgba(64, 181, 173, 0.3);
            border-radius: 20px;
            padding: 40px 20px;
            transition: all 0.3s;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
        }

        #drop-zone:hover {
            border-color: var(--primary);
            background: rgba(64, 181, 173, 0.05);
            transform: translateY(-2px);
        }

        #settings-panel {
            height: 100%; width: 0; position: fixed; z-index: 100;
            top: 0; right: 0; background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px); overflow-x: hidden;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid rgba(64, 181, 173, 0.2);
        }

        /* 隐藏滚动条 */
        #settings-material-list::-webkit-scrollbar { width: 4px; }
        #settings-material-list::-webkit-scrollbar-thumb { background: var(--primary); }

        .count-item {
            background: rgba(0, 0, 0, 0.6) !important;
            margin-bottom: 4px; border-radius: 4px;
            border-left: 2px solid var(--primary);
            font-size: 12px; padding: 6px 12px !important;
        }

        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            z-index: 50;
        }
        #vertical-controls {
            position: fixed;
            bottom: 80px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 200;
        }
        #vertical-controls.hidden { display: none; }
        #vertical-controls button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(128, 0, 255, 0.3);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(128, 0, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
        }
        #vertical-controls button:active {
            background: rgba(128, 0, 255, 0.6);
            box-shadow: 0 0 20px rgba(128, 0, 255, 0.5);
        }
        #vertical-controls button i {
            color: white;
            font-size: 28px;
        }
        /* 首次触摸后消退引导色，保留可用按钮 */
        #vertical-controls.fade-guide button {
            background: rgba(128, 0, 255, 0.15);
            border-color: rgba(128, 0, 255, 0.2);
        }
        #vertical-controls.fade-guide button:active {
            background: rgba(128, 0, 255, 0.4);
            box-shadow: none;
        }
        /* 镜像开关 */
        #mirror-toggle:checked + div {
            background: rgba(64, 181, 173, 0.2);
            border-color: var(--primary);
        }
        #mirror-toggle:checked + div > div {
            transform: translateX(20px);
            background: var(--primary);
        }

        /* 移动端操作提示 */
        #touch-hints {
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 190;
        }
        #touch-hints .hint-left {
            position: absolute;
            top: 0; left: 0; bottom: 0; width: 40%;
            background: linear-gradient(135deg, rgba(0, 200, 0, 0.15) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #touch-hints .hint-right {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 40%;
            background: linear-gradient(225deg, rgba(255, 50, 50, 0.10) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #touch-hints .hint-text {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            text-shadow: 0 0 12px rgba(0,0,0,0.8);
            text-align: center;
            pointer-events: none;
        }
        #touch-hints .hint-icon {
            font-size: 36px;
            display: block;
            margin-bottom: 6px;
        }
        #touch-hints .hint-left .hint-text { color: rgba(100, 255, 100, 0.8); }
        #touch-hints .hint-right .hint-text { color: rgba(255, 100, 100, 0.8); }
    </style>
</head>

<body>
<div class="top-bar"></div>

<div id="viewer"></div>

<!-- 移动端触控提示 -->
<div id="touch-hints" class="fixed inset-0 hidden">
    <div class="hint-left">
        <div class="hint-text">
            <span class="hint-icon material-icons">touch_app</span>
            单指移动
        </div>
    </div>
    <div class="hint-right">
        <div class="hint-text">
            <span class="hint-icon material-icons">rotate_right</span>
            单指旋转
        </div>
    </div>
</div>

<div id="vertical-controls" class="hidden">
    <button id="btn-up">
        <i class="material-icons">keyboard_arrow_up</i>
    </button>
    <button id="btn-down">
        <i class="material-icons">keyboard_arrow_down</i>
    </button>
</div>
    </div>
</div>

<div id="loading-overlay" class="fixed inset-0 z-[999] bg-black/80 flex justify-center items-center hidden">
    <div class="flex flex-col items-center">
        <div class="spinner border-4 border-t-[#40B5AD] border-white/20 rounded-full w-12 h-12 animate-spin mb-4"></div>
        <p class="text-[#40B5AD] font-mono text-xs tracking-widest">DECODING_NBT...</p>
    </div>
</div>

<a href="#" id="settings-button" class="fixed top-6 right-8 z-[110] text-white/50 hover:text-[#40B5AD] transition-all">
    <i class="fa fa-cog"></i>
</a>

<div id="main-content" class="relative z-10 flex flex-col items-center justify-center min-h-screen p-6 transition-all duration-700">
    <div class="glass-panel max-w-2xl w-full p-10 text-center">
        <h1 class="text-3xl font-black tracking-tighter mb-2 text-[#40B5AD] italic">投影预览系统</h1>
        <p class="text-xs font-mono text-white/40 mb-10 uppercase tracking-[0.3em]">Litematic Preview</p>

        <div id="file-loader-panel">
            <input id="file-upload" type="file" hidden />
            <label for="file-upload" id="drop-zone">
                <div class="flex flex-col items-center pointer-events-none">
                    <i class="material-icons text-5xl text-[#40B5AD] mb-4">cloud_upload</i>
                    <h3 class="text-xl font-bold mb-1">选择投影</h3>
                    <p class="text-sm text-white/40">选择/拖拽.litematic文件</p>
                </div>
            </label>

            <div class="mt-12">
                <div class="relative group">
                    <input id="remote-url-input" type="text" placeholder="Paste remote link here..."
                           class="w-full bg-white/5 border-b border-white/10 p-4 focus:outline-none focus:border-[#40B5AD] transition-all font-mono text-sm">
                    <button id="submit-remote-btn" class="absolute right-2 top-2 p-2 text-[#40B5AD]">
                        <i class="material-icons">send</i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="settings-panel">
    <a href="#" id="settings-close" class="absolute top-6 right-6 text-3xl text-white/50 hover:text-white">&times;</a>
    <div class="p-8">
        <h3 class="text-xl font-bold text-[#40B5AD] mb-8 font-mono">设置</h3>
        <button id="cancel-preview-btn" class="w-full py-3 mb-10 bg-red-900/40 border border-red-500/50 text-red-200 text-xs font-bold uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all hidden">
            取消预览
        </button>
        <div id="settings-sliders" class="mb-8 space-y-3"></div>
        <!-- 镜像模式 -->
        <label class="flex items-center gap-3 mb-8 cursor-pointer">
            <input type="checkbox" id="mirror-toggle" class="sr-only setting" data-setting="mirrorMode">
            <div class="w-10 h-5 rounded-full bg-white/10 border border-white/20 transition-colors relative">
                <div class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-[#40B5AD] transition-transform"></div>
            </div>
            <span class="text-xs font-mono text-white/60">Mirror View</span>
        </label>
        <div id="settings-material-list" class="max-h-[40vh] overflow-y-auto mb-8 space-y-1"></div>
        <div id="settings-container" class="space-y-6"></div>
    </div>
</div>

<img id="atlas" src="/Extra-Function/litematic-preview/resource/atlas.png" crossorigin="anonymous" hidden>

<script src="/Extra-Function/litematic-preview/src/deepslate-helpers.js"></script>
<script src="/Extra-Function/litematic-preview/src/litematic-utils.js"></script>
<script src="/Extra-Function/litematic-preview/src/viewer.js"></script>
<script src="/Extra-Function/litematic-preview/src/main.js"></script>
<script src="/Extra-Function/litematic-preview/src/settings.js"></script>

<script src="/Extra-Function/litematic-preview/src/ui-init.js"></script>
</body>
</html>
