<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0"/>
    <link rel="preconnect" href="https://cdn.jsdmirror.com">
    <title>OpenST | Litematic Viewer</title>
    <link rel="icon" href="/images/favicon.png" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-2.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-2.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-2.png">
    <link rel="icon" type="image/png" sizes="128x128" href="/images/favicon-2.png">
    <link rel="icon" type="image/png" sizes="196x196" href="/images/favicon-2.png">
    <link rel="apple-touch-icon" href="/images/favicon.png" sizes="any">

    <script src="https://unpkg.com/deepslate@0.10.1"></script>
    <script src="https://unpkg.com/gl-matrix@3.4.3/gl-matrix-min.js"></script>
    <script src="/Extra-Function/litematic-preview/resource/assets.js"></script>
    <script src="/Extra-Function/litematic-preview/resource/opaque.js"></script>

    <link rel="stylesheet" href="../../css/ArchiveOutput.css">
    <link rel="stylesheet" href="https://fonts.geekzu.org/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdn.jsdmirror.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="/archive/scripts/insights.js" type="module"></script>

    <style>
        :root {
            --primary: #40B5AD;
            --bg-dark: #0c0c0c;
            --panel-bg: rgba(20, 20, 20, 0.85);
        }

        *, *::before, *::after {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #e0e0e0;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            margin: 0;
        }

        /* 3D 背景层 */
        #viewer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        /* 玻璃拟态面板 */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.5s ease;
        }

        #drop-zone {
            display: block;
            border: 2px dashed rgba(64, 181, 173, 0.3);
            border-radius: 20px;
            padding: 40px 20px;
            transition: all 0.3s;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
        }

        #drop-zone:hover {
            border-color: var(--primary);
            background: rgba(64, 181, 173, 0.05);
            transform: translateY(-2px);
        }

        #settings-panel {
            height: 100%; width: 0; position: fixed; z-index: 100;
            top: 0; right: 0; background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px); overflow-x: hidden;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid rgba(64, 181, 173, 0.2);
        }

        /* 隐藏滚动条 */
        #settings-material-list::-webkit-scrollbar { width: 4px; }
        #settings-material-list::-webkit-scrollbar-thumb { background: var(--primary); }

        .count-item {
            background: rgba(0, 0, 0, 0.6) !important;
            margin-bottom: 4px; border-radius: 4px;
            border-left: 2px solid var(--primary);
            font-size: 12px; padding: 6px 12px !important;
        }

        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            z-index: 50;
        }
        #vertical-controls {
            position: fixed;
            bottom: 80px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 200;
        }
        #vertical-controls.hidden { display: none; }
        #vertical-controls button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(128, 0, 255, 0.3);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(128, 0, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
        }
        #vertical-controls button:active {
            background: rgba(128, 0, 255, 0.6);
            box-shadow: 0 0 20px rgba(128, 0, 255, 0.5);
        }
        #vertical-controls button i {
            color: white;
            font-size: 28px;
        }
        /* 首次触摸后消退引导色，保留可用按钮 */
        #vertical-controls.fade-guide button {
            background: rgba(128, 0, 255, 0.15);
            border-color: rgba(128, 0, 255, 0.2);
        }
        #vertical-controls.fade-guide button:active {
            background: rgba(128, 0, 255, 0.4);
            box-shadow: none;
        }
        /* 镜像开关 */
        #mirror-toggle:checked + div {
            background: rgba(64, 181, 173, 0.2);
            border-color: var(--primary);
        }
        #mirror-toggle:checked + div > div {
            transform: translateX(20px);
            background: var(--primary);
        }

        /* 移动端操作提示 */
        #touch-hints {
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 190;
        }
        #touch-hints .hint-left {
            position: absolute;
            top: 0; left: 0; bottom: 0; width: 40%;
            background: linear-gradient(135deg, rgba(0, 200, 0, 0.15) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #touch-hints .hint-right {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 40%;
            background: linear-gradient(225deg, rgba(255, 50, 50, 0.10) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #touch-hints .hint-text {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            text-shadow: 0 0 12px rgba(0,0,0,0.8);
            text-align: center;
            pointer-events: none;
        }
        #touch-hints .hint-icon {
            font-size: 36px;
            display: block;
            margin-bottom: 6px;
        }
        #touch-hints .hint-left .hint-text { color: rgba(100, 255, 100, 0.8); }
        #touch-hints .hint-right .hint-text { color: rgba(255, 100, 100, 0.8); }
    </style>
</head>

<body>
<div class="top-bar"></div>

<div id="viewer"></div>

<!-- 移动端触控提示 -->
<div id="touch-hints" class="fixed inset-0 hidden">
    <div class="hint-left">
        <div class="hint-text">
            <span class="hint-icon material-icons">touch_app</span>
            单指移动
        </div>
    </div>
    <div class="hint-right">
        <div class="hint-text">
            <span class="hint-icon material-icons">rotate_right</span>
            单指旋转
        </div>
    </div>
</div>

<div id="vertical-controls" class="hidden">
    <button id="btn-up">
        <i class="material-icons">keyboard_arrow_up</i>
    </button>
    <button id="btn-down">
        <i class="material-icons">keyboard_arrow_down</i>
    </button>
</div>
    </div>
</div>

<div id="loading-overlay" class="fixed inset-0 z-[999] bg-black/80 flex justify-center items-center hidden">
    <div class="flex flex-col items-center">
        <div class="spinner border-4 border-t-[#40B5AD] border-white/20 rounded-full w-12 h-12 animate-spin mb-4"></div>
        <p class="text-[#40B5AD] font-mono text-xs tracking-widest">DECODING_NBT...</p>
    </div>
</div>

<a href="javascript:void(0)" id="settings-button" class="fixed top-6 right-8 z-[110] text-white/50 hover:text-[#40B5AD] transition-all" onclick="openSettings()">
    <i class="fa fa-cog"></i>
</a>

<div id="main-content" class="relative z-10 flex flex-col items-center justify-center min-h-screen p-6 transition-all duration-700">
    <div class="glass-panel max-w-2xl w-full p-10 text-center">
        <h1 class="text-3xl font-black tracking-tighter mb-2 text-[#40B5AD] italic">投影预览系统</h1>
        <p class="text-xs font-mono text-white/40 mb-10 uppercase tracking-[0.3em]">Litematic Preview</p>

        <div id="file-loader-panel">
            <input id="file-upload" type="file" onchange="readFileInput(this)" hidden />
            <label for="file-upload" id="drop-zone" ondrop="dropHandler(event);" ondragover="dragOverHandler(event);">
                <div class="flex flex-col items-center pointer-events-none">
                    <i class="material-icons text-5xl text-[#40B5AD] mb-4">cloud_upload</i>
                    <h3 class="text-xl font-bold mb-1">选择投影</h3>
                    <p class="text-sm text-white/40">选择/拖拽.litematic文件</p>
                </div>
            </label>

            <div class="mt-12">
                <div class="relative group">
                    <input id="remote-url-input" type="text" placeholder="Paste remote link here..."
                           class="w-full bg-white/5 border-b border-white/10 p-4 focus:outline-none focus:border-[#40B5AD] transition-all font-mono text-sm">
                    <button class="absolute right-2 top-2 p-2 text-[#40B5AD]" onclick="submitRemoteFile()">
                        <i class="material-icons">send</i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="settings-panel">
    <a href="javascript:void(0)" class="absolute top-6 right-6 text-3xl text-white/50 hover:text-white" onclick="closeSettings()">&times;</a>
    <div class="p-8">
        <h3 class="text-xl font-bold text-[#40B5AD] mb-8 font-mono">设置</h3>
        <button id="cancel-preview-btn" class="w-full py-3 mb-10 bg-red-900/40 border border-red-500/50 text-red-200 text-xs font-bold uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all hidden"
                onclick="history.replaceState(null, '', ' '); location.reload();">
            取消预览
        </button>
        <div id="settings-sliders" class="mb-8 space-y-3"></div>
        <!-- 镜像模式 -->
        <label class="flex items-center gap-3 mb-8 cursor-pointer">
            <input type="checkbox" id="mirror-toggle" class="sr-only setting" data-setting="mirrorMode"
                   onchange="var m=this.checked;if(window.vEngine)window.vEngine.mirrorMode=m;applyMirrorLayout(m)">
            <div class="w-10 h-5 rounded-full bg-white/10 border border-white/20 transition-colors relative">
                <div class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-[#40B5AD] transition-transform"></div>
            </div>
            <span class="text-xs font-mono text-white/60">Mirror View</span>
        </label>
        <div id="settings-material-list" class="max-h-[40vh] overflow-y-auto mb-8 space-y-1"></div>
        <div id="settings-container" class="space-y-6"></div>
    </div>
</div>

<img id="atlas" src="/Extra-Function/litematic-preview/resource/atlas.png" crossorigin="anonymous" hidden>
<img id="chest-normal" src="/Extra-Function/litematic-preview/resource/chest/normal.png" crossorigin="anonymous" hidden>
<img id="chest-normal-left" src="/Extra-Function/litematic-preview/resource/chest/normal_left.png" crossorigin="anonymous" hidden>
<img id="chest-normal-right" src="/Extra-Function/litematic-preview/resource/chest/normal_right.png" crossorigin="anonymous" hidden>
<img id="chest-trapped" src="/Extra-Function/litematic-preview/resource/chest/trapped.png" crossorigin="anonymous" hidden>
<img id="chest-trapped-left" src="/Extra-Function/litematic-preview/resource/chest/trapped_left.png" crossorigin="anonymous" hidden>
<img id="chest-trapped-right" src="/Extra-Function/litematic-preview/resource/chest/trapped_right.png" crossorigin="anonymous" hidden>
<img id="chest-ender" src="/Extra-Function/litematic-preview/resource/chest/ender.png" crossorigin="anonymous" hidden>
<img id="chest-front-upper" src="/Extra-Function/litematic-preview/resource/chest/normal/前上半边.png" crossorigin="anonymous" hidden>
<img id="chest-front-lower" src="/Extra-Function/litematic-preview/resource/chest/normal/前下半边.png" crossorigin="anonymous" hidden>
<img id="chest-side-upper" src="/Extra-Function/litematic-preview/resource/chest/normal/后+右+左上半边.png" crossorigin="anonymous" hidden>
<img id="chest-side-lower" src="/Extra-Function/litematic-preview/resource/chest/normal/后+右+左下半边.png" crossorigin="anonymous" hidden>
<img id="chest-top-bottom" src="/Extra-Function/litematic-preview/resource/chest/normal/top+buttom.png" crossorigin="anonymous" hidden>

<script src="/Extra-Function/litematic-preview/src/deepslate-helpers.js"></script>
<script src="/Extra-Function/litematic-preview/src/litematic-utils.js"></script>
<script src="/Extra-Function/litematic-preview/src/viewer.js"></script>
<script src="/Extra-Function/litematic-preview/src/main.js"></script>
<script src="/Extra-Function/litematic-preview/src/settings.js"></script>

<script>
    // 初始化 UI 交互逻辑
    document.addEventListener("DOMContentLoaded", () => {
        const image = document.getElementById('atlas');
        const chestIds = ['chest-normal','chest-normal-left','chest-normal-right',
          'chest-trapped','chest-trapped-left','chest-trapped-right','chest-ender',
          'chest-front-upper','chest-front-lower','chest-side-upper','chest-side-lower','chest-top-bottom'];
        const initResources = () => loadDeepslateResources(image);

        var loaded = 0;
        var total = 1 + chestIds.length;
        function checkAll() { loaded++; if (loaded >= total) initResources(); }
        function onError(id) { loaded++; if (loaded >= total) initResources(); }

        if (image.complete) checkAll(); else { image.addEventListener('load', checkAll); image.addEventListener('error', function(){ onError('atlas'); }); }
        chestIds.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                if (el.complete && el.naturalWidth > 0) checkAll();
                else { el.addEventListener('load', checkAll); el.addEventListener('error', function(){ onError(id); }); }
            } else { onError(id); }
        });

        // 恢复镜像模式
        var mirrorCb = document.getElementById('mirror-toggle');
        if (mirrorCb && mirrorCb.checked && window.vEngine) {
            window.vEngine.mirrorMode = true;
            applyMirrorLayout(true);
        }

        // 检查 ?viewerUse=URL 参数
        var params = new URLSearchParams(window.location.search);
        var viewerUse = params.get('viewerUse');
        if (viewerUse) {
            var mainContent = document.getElementById('main-content');
            if (mainContent) {
                mainContent.classList.add('opacity-0', 'pointer-events-none', 'scale-95');
                setTimeout(function() { mainContent.style.display = 'none'; }, 500);
            }
            readFileURL(viewerUse);
            return;
        }

        // 执行哈希路由检查
        handleHashRoute();
    });

    // #https://...
    function handleHashRoute() {
        const hash = window.location.hash.substring(1); // 去掉开头的 #
        if (hash && hash.startsWith('http')) {
            console.log(`🚀 发现哈希路由: ${hash}`);

            // 同步显示到输入框（视觉反馈）
            const urlInput = document.getElementById('remote-url-input');
            if (urlInput) urlInput.value = hash;

            readFileURL(hash);
        }
    }

    // 监听地址栏手动修改
    window.addEventListener('hashchange', handleHashRoute);
    // 文件上传统一入口 (适配 File 和 Blob)
    function handleFileSelection(file) {
        if (!file) return;
        showLoading();

        // 隐藏主面板的动画
        const main = document.getElementById('main-content');
        main.classList.add('opacity-0', 'pointer-events-none', 'scale-95');

        if (typeof loadAndProcessFile === 'function') {
            loadAndProcessFile(file);
        }
    }

    function readFileInput(input) {
        if (input.files && input.files[0]) handleFileSelection(input.files[0]);
    }

    function dropHandler(ev) {
        ev.preventDefault();
        const file = ev.dataTransfer.items ? ev.dataTransfer.items[0].getAsFile() : ev.dataTransfer.files[0];
        handleFileSelection(file);
    }

    function dragOverHandler(ev) { ev.preventDefault(); }

    function submitRemoteFile() {
        const urlInput = document.getElementById('remote-url-input');
        const url = urlInput.value.trim();
        if (url) {
            readFileURL(url);
        } else {
            alert("请先输入有效的 URL 链接");
        }
    }

    function readFileURL(url) {
        showLoading();
        console.log(`正在发起请求: ${url}`);

        // 直接 Fetch，不经过任何中转
        fetch(url, { mode: 'cors' })
            .then(res => {
                if (!res.ok) throw new Error(`服务器响应失败: ${res.status}`);
                return res.blob();
            })
            .then(blob => {
                // 将 Blob 传递给解析引擎
                handleFileSelection(blob);
            })
            .catch(err => {
                console.error("失败:", err);
                alert("远程加载失败。请检查：\n1. 链接是否正确\n2. 目标服务器是否允许 CORS 跨域访问");
                hideLoading();
                // 恢复 UI 状态
                const main = document.getElementById('main-content');
                main.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
            });
    }

    function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
    function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

    function applyMirrorLayout(mirror) {
        var leftHint = document.querySelector('#touch-hints .hint-left');
        var rightHint = document.querySelector('#touch-hints .hint-right');
        var vCtrl = document.getElementById('vertical-controls');
        if (mirror) {
            if (leftHint) {
                leftHint.querySelector('.hint-text').innerHTML = '<span class="hint-icon material-icons">rotate_right</span>单指旋转';
                leftHint.style.background = 'linear-gradient(135deg, rgba(255, 50, 50, 0.10) 0%, transparent 100%)';
            }
            if (rightHint) {
                rightHint.querySelector('.hint-text').innerHTML = '<span class="hint-icon material-icons">touch_app</span>单指移动';
                rightHint.style.background = 'linear-gradient(225deg, rgba(0, 200, 0, 0.15) 0%, transparent 100%)';
            }
            if (vCtrl) { vCtrl.style.right = 'auto'; vCtrl.style.left = '20px'; }
        } else {
            if (leftHint) {
                leftHint.querySelector('.hint-text').innerHTML = '<span class="hint-icon material-icons">touch_app</span>单指移动';
                leftHint.style.background = '';
            }
            if (rightHint) {
                rightHint.querySelector('.hint-text').innerHTML = '<span class="hint-icon material-icons">rotate_right</span>单指旋转';
                rightHint.style.background = '';
            }
            if (vCtrl) { vCtrl.style.left = 'auto'; vCtrl.style.right = '20px'; }
        }
    }

</script>
</body>
</html>
